<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>沉浸式 AI 筆記本</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="notebook.css" />
</head>
<body class="notebook-body">
  <div class="notebook-mode">
    <div class="bg-orb orb-a" aria-hidden="true"></div>
    <div class="bg-orb orb-b" aria-hidden="true"></div>

    <header class="header">
      <div class="header-main">
        <div class="header-icon">✺</div>
        <div class="header-text">
          <h1 class="header-title">Notebook Atlas</h1>
          <p class="header-sub">Immersive Translation Favorites</p>
        </div>
        <div class="header-count">
          <span id="total-count">0</span>
          <span class="count-label">Saved</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-toggle-ai-settings" class="btn btn-primary btn-ai-settings">AI 模型設定</button>
      </div>
    </header>

    <!-- AI Settings Panel -->
    <section id="ai-settings-panel" class="settings-panel hidden">
      <div class="settings-header">
        <h2>🤖 AI 模型設定</h2>
      </div>
      
      <div class="settings-group">
        <label>選擇 AI 服務提供商</label>
        <div class="radio-group">
          <label>
            <input type="radio" name="ai-provider" value="gemini" checked>
            Google Gemini (建議)
          </label>
          <label>
            <input type="radio" name="ai-provider" value="openai">
            OpenAI
          </label>
        </div>
      </div>

      <div class="settings-group">
        <label id="api-key-label">Google AI Studio API Key</label>
        <div class="input-with-btn">
          <input type="password" id="api-key-input" placeholder="輸入您的 API Key...">
          <button id="btn-verify-model" class="btn btn-secondary">驗證並取得模型</button>
        </div>
        <p class="settings-hint">您的 Key 僅會儲存在瀏覽器端 (Local Storage) ，不會上傳至伺服器。</p>
      </div>

      <div class="settings-group">
        <label>選擇或輸入模型 (Model)</label>
        <div class="input-with-btn">
          <select id="model-select">
            <option value="gemini-1.5-flash">gemini-1.5-flash</option>
            <option value="gemini-1.5-pro">gemini-1.5-pro</option>
          </select>
          <input type="text" id="model-custom" placeholder="或手動輸入模型名稱..." value="gemini-1.5-flash">
        </div>
      </div>

      <div class="settings-group">
        <label>設定解析結果輸出語言</label>
        <div class="input-with-btn">
          <select id="lang-select">
            <option value="繁體中文">繁體中文 (Traditional Chinese)</option>
            <option value="简体中文">简体中文 (Simplified Chinese)</option>
            <option value="English">English</option>
            <option value="日本語">日本語 (Japanese)</option>
            <option value="한국어">한국어 (Korean)</option>
          </select>
        </div>
      </div>
      
      <div class="settings-actions">
        <span id="settings-status"></span>
        <button id="btn-save-settings" class="btn btn-primary">儲存設定</button>
      </div>
    </section>

    <section class="toolbar">
      <div class="search-bar">
        <label for="search-input" class="search-icon">⌕</label>
        <input type="text" id="search-input" class="search-input" placeholder="搜尋筆記本原文或譯文..." autocomplete="off" />
      </div>
      <div class="toolbar-meta">
        <span id="results-meta">顯示 0 / 0</span>
        <span class="toolbar-hint">Press <kbd>/</kbd> to focus search</span>
      </div>
    </section>

    <main id="pairs-container" class="pairs-container">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">✦</div>
        <p>筆記本空空如也</p>
        <p class="empty-hint">在翻譯小視窗中點擊 ➕ 收藏按鈕<br />您收藏的精華句會出現在這裡</p>
      </div>
    </main>
    
    <!-- AI Modal -->
    <div id="ai-modal" class="modal hidden">
      <div class="modal-content">
        <button id="modal-close" class="modal-close">×</button>
        <div class="modal-header">
          <h3>✨ AI 深度文法解析</h3>
        </div>
        <div class="modal-body">
          <div id="ai-modal-source" class="modal-source-box"></div>
          <div id="ai-modal-result" class="modal-result-box">
            <div class="loading-spinner">努力解析中...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="notebook.js"></script>
</body>
</html>
